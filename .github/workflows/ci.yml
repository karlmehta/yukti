# Checks this repository itself. The engine is one bash script and everything it
# ships beside it is JSON, so both are checkable on a Linux runner in seconds -
# no simulator, no device, no secrets. The template that drives a real app lives
# in examples/ci/ and is not run from here.

name: CI

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: yukti parses
        run: bash -n yukti

      - name: shipped JSON is valid
        run: |
          set -u
          status=0
          found=0
          while IFS= read -r -d '' f; do
            found=$((found + 1))
            python3 -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; status=1; }
          done < <(find flows examples -type f -name '*.json' -print0)
          # A check that examined nothing passes, and a pass that examined
          # nothing is the failure this repository already paid for once.
          [ "$found" -gt 0 ] || { echo "no JSON files found under flows/ or examples/"; status=1; }
          echo "checked $found JSON file(s)"
          exit $status

      - name: shipped flows build
        env:
          # Four of the five files under flows/ need ${TEST_EMAIL} /
          # ${TEST_PASSWORD}: two examples carry them, the sign-in block carries
          # them, and the flow that includes that block inherits them. The
          # builder refuses a variable that is not set rather than let the text
          # be typed into a field as written. The check needs the names to
          # resolve, not the values to be real: nothing here signs in anywhere.
          TEST_EMAIL: checker@example.invalid
          TEST_PASSWORD: unused-by-the-check
        run: |
          set -u
          status=0
          found=0
          while IFS= read -r -d '' f; do
            found=$((found + 1))
            ./yukti flow --check "$f" || status=1
          done < <(find flows -type f -name '*.json' -print0)
          [ "$found" -gt 0 ] || { echo "no flows found under flows/"; status=1; }
          exit $status
